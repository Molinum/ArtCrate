<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel | Administración ArtCrate</title>
  <!-- Bootstrap 5 (CDN): se carga ANTES que el CSS propio -->

    <nav aria-label="Menú de administración">
