<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel | Administración ArtCrate</title>
  <!-- Tipografías (Google Fonts): Playfair Display para títulos e Inter para el texto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600;700&display=swap">
  <!-- Bootstrap 5 (CDN): se carga ANTES que el CSS propio -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!-- CSS propio de ArtCrate -->
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <!-- Encabezado del panel de administración (separado del sitio del cliente) -->
  <header>
    <!-- Menú superior oscuro: se colapsa con botón hamburguesa bajo 992 px -->
    <nav class="navbar navbar-expand-lg navbar-dark admin-navbar" aria-label="Menú de administración">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <img src="../assets/img/logo-artcrate-claro.svg" alt="ArtCrate, administración" width="180" height="48">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-admin" aria-controls="menu-admin" aria-expanded="false" aria-label="Mostrar u ocultar el menú">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu-admin">
          <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html" aria-current="page">Panel</a></li>
          <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="pedidos.html">Pedidos</a></li>
          <li class="nav-item"><a class="nav-link" href="../index.html">Volver a la tienda</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-4">
    <h1 class="mb-4">Panel de administración</h1>

    <!-- Indicadores de ejemplo (datos estáticos) -->
    <section class="mb-5" aria-labelledby="titulo-resumen">
      <h2 id="titulo-resumen" class="h4 mb-3">Resumen de la tienda</h2>
      <!-- Tarjetas de Bootstrap en grilla: se apilan en móvil y van en fila desde 768 px -->
      <div class="row g-4">
        <div class="col-12 col-md-4">
          <div class="card h-100 tarjeta-indicador">
            <div class="card-body">
              <p class="card-text mb-1">Productos</p>
              <p class="indicador mb-0">12</p>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-4">
          <div class="card h-100 tarjeta-indicador">
            <div class="card-body">
              <p class="card-text mb-1">Pedidos</p>
              <p class="indicador mb-0">8</p>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-4">
          <div class="card h-100 tarjeta-indicador">
            <div class="card-body">
              <p class="card-text mb-1">Productos con stock bajo</p>
              <p class="indicador text-danger mb-0">3</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section aria-labelledby="titulo-accesos">
      <h2 id="titulo-accesos" class="h4 mb-3">Accesos rápidos</h2>
      <div class="list-group">
        <a class="list-group-item list-group-item-action" href="productos.html">Gestionar productos</a>
        <a class="list-group-item list-group-item-action" href="pedidos.html">Ver pedidos</a>
      </div>
    </section>
  </main>

  <footer class="admin-footer text-center py-3 mt-4">
    <p class="mb-0">Panel de administración ArtCrate &middot; Datos de ejemplo</p>
  </footer>


  <!-- JavaScript de Bootstrap (solo para sus componentes); no hay JavaScript propio en este sprint -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
